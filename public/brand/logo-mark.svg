<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Quest Horror Clinic">
  <title>Quest Horror Clinic — знак</title>
  <defs>
    <linearGradient id="hc-slit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#ffe4e0" stop-opacity="0.72"/>
      <stop offset="0.62" stop-color="#e0626b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e0626b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0626b" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#8b1419" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b1419" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hc-spill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4e8e4" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#f4e8e4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f4e8e4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hc-door" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#1b1b21"/>
      <stop offset="0.55" stop-color="#101014"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <clipPath id="hc-frame">
      <path d="M27 15h45v64H27z"/>
    </clipPath>
  </defs>

  <!-- корпус знака -->
  <rect x="1.5" y="1.5" width="93" height="93" rx="10" fill="#07070a"/>
  <rect x="1.5" y="1.5" width="93" height="93" rx="10" fill="none" stroke="#e6e1d8" stroke-opacity="0.14"/>

  <!-- дверной проём -->
  <g clip-path="url(#hc-frame)">
    <rect x="27" y="15" width="45" height="64" fill="#000"/>
    <ellipse cx="34" cy="44" rx="30" ry="34" fill="url(#hc-glow)"/>

    <!-- створка двери, приоткрытая внутрь -->
    <path d="M50 17.5 70.5 22v50.5L50 76.5z" fill="url(#hc-door)"/>
    <path d="M50 17.5 70.5 22v50.5L50 76.5z" fill="none" stroke="#3a3a44" stroke-opacity="0.55" stroke-width="0.8"/>
    <!-- ручка -->
    <circle cx="65.5" cy="48" r="1.9" fill="#c3beb3" fill-opacity="0.85"/>

    <!-- щель света -->
    <rect x="29.5" y="15" width="3.6" height="64" fill="url(#hc-slit)"/>
    <rect x="29.5" y="15" width="1.1" height="64" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- свет, падающий на пол -->
  <rect x="27" y="79" width="45" height="3.2" fill="url(#hc-spill)"/>
  <path d="M27 15h45" stroke="#e6e1d8" stroke-opacity="0.22" stroke-width="1"/>

  <!-- капля на раме: единственный «кровавый» штрих -->
  <path d="M31 79.2v5.4c0 .9 1.5.9 1.5 0v-5.4z" fill="#e0626b" fill-opacity="0.9"/>
</svg>
