  <!-- знак -->
  <rect x="1" y="1" width="72" height="88" rx="9" fill="#07070a"/>
  <rect x="1" y="1" width="72" height="88" rx="9" fill="none" stroke="#e6e1d8" stroke-opacity="0.14"/>
  <g clip-path="url(#hc-frame-h)">
    <rect x="13" y="13" width="44" height="64" fill="#000"/>
    <ellipse cx="20" cy="42" rx="29" ry="34" fill="url(#hc-glow-h)"/>
    <path d="M35.5 15.5 55 20v50.5L35.5 74.5z" fill="url(#hc-door-h)"/>
    <path d="M35.5 15.5 55 20v50.5L35.5 74.5z" fill="none" stroke="#3a3a44" stroke-opacity="0.55" stroke-width="0.8"/>
    <circle cx="50.5" cy="46" r="1.8" fill="#c3beb3" fill-opacity="0.85"/>
    <rect x="15.5" y="13" width="3.4" height="64" fill="url(#hc-slit-h)"/>
