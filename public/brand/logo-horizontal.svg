  <path d="M13 13h44" stroke="#e6e1d8" stroke-opacity="0.22" stroke-width="1"/>
  <rect x="13" y="77" width="44" height="3" fill="#f4e8e4" fill-opacity="0.14"/>
  <path d="M17 77.2v4.6c0 .8 1.4.8 1.4 0v-4.6z" fill="#e0626b" fill-opacity="0.9"/>

