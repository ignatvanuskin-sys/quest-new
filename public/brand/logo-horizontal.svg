<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" width="520" height="96" role="img" aria-label="Quest Horror Clinic">
  <title>Quest Horror Clinic — горизонтальный логотип</title>
  <defs>
    <linearGradient id="hc-slit-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#ffe4e0" stop-opacity="0.72"/>
      <stop offset="0.62" stop-color="#e0626b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e0626b" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hc-glow-h" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0626b" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#8b1419" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b1419" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hc-door-h" x1="0" y1="0" x2="1" y2="0.35">
